# Tools for the divbast branch's checks, run locally and by
# .github/workflows/divbast-ci.yml through mise.

[tools]
"core:go" = "1.27.4"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"

[env]
# The toolchain is the one pinned above, never one go.mod's toolchain line
# would download
GOTOOLCHAIN = "local"
# WriteFreely's SQLite support exists only under the sqlite tag, and the
# MySQL tests skip unless TEST_MYSQL is set
GOFLAGS = "-tags=sqlite"
